# This file automates the template repository robotics-ost/met3_r_template.
# It is not needed in your own repository. You can delete the whole .github folder.

name: Create Release on Tag

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build_latex_and_upload:
    if: github.repository == 'robotics-ost/met3_r_template' # only run in the original template, not in student repos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true