name: Create Release on Tag

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build_latex_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true